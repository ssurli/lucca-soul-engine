name: lucca_soul_app
description: >
  Lucca Soul Lab — l'app Flutter dello Human Experience Layer. Parla solo con
  il BFF (services/api): onboarding conversazionale, itinerario spiegabile,
  card adattiva ai segnali della città.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: 8.3.2
  http: ^1.2.0
  latlong2: 0.10.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/mura_punti.json
  # Caratteri incorporati (variabili, licenza OFL: vedi OFL.txt accanto a ciascun file).
  fonts:
    - family: Domine
      fonts:
        - asset: assets/fonts/domine/Domine-Variable.ttf
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/nunitosans/NunitoSans-Variable.ttf
