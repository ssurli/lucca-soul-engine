[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucca-contracts"
version = "0.1.0"
description = "Lucca Soul Lab — Engine: contratti dati condivisi (Pydantic v2). Single source of verità per tutti i servizi (services/api, experience-engine, graph, rag, recommender, urban-memory, intelligence-index)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
]

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

[tool.hatch.metadata]
allow-direct-references = true

