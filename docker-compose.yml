# Lucca Soul Lab — infrastruttura di sviluppo (MODALITÀ CLOUD).
#
# Neo4j  -> Aura (cloud)   : configurato in .env (NEO4J_URI=neo4j+s://...)
# Postgres -> Neon (cloud) : configurato in .env (DATABASE_URL=...)
# Qui resta solo il Vector DB, che gira in locale.
#
# Se un giorno vuoi tornare tutto in locale, decommenta i servizi in fondo.

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: lucca_qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:

