# Lucca Soul Lab — PROFILO LOCALE (opzionale, per macchine con Docker).
#
# Il progetto gira in DUE profili, con lo STESSO codice. Cambia solo il .env:
#
#   PROFILO CLOUD  (notebook senza Docker)   -> Neo4j Aura + Neon
#   PROFILO LOCALE (questo file, con Docker) -> Neo4j Community + Postgres+pgvector
#
# Il vector store è pgvector in ENTRAMBI i profili: una sola implementazione RAG.
#
# Avvio:   docker compose up -d
# Stop:    docker compose down          (aggiungi -v per cancellare i dati)

services:
  postgres:
    # immagine Postgres con pgvector già incluso: stesso vector store di Neon
    image: pgvector/pgvector:pg16
    container_name: lucca_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lucca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lucca}
      POSTGRES_DB: ${POSTGRES_DB:-lucca_soul}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lucca} -d ${POSTGRES_DB:-lucca_soul}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    # Community Edition: gratuita, self-hosted, nessun limite di dati
    image: neo4j:5-community
    container_name: lucca_neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:-luccasoul}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
  neo4j_data:
