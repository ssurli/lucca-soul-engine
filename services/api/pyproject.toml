[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucca-api"
version = "0.1.0"
description = "Lucca Soul Lab — Engine: BFF FastAPI. Unico ingresso per l'app Flutter; orchestra i servizi interni (experience-engine, graph, rag, recommender). Non tocca mai i database direttamente in Wave 0."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2",
    "pydantic-settings>=2",
]

# NOTA — pacchetti locali (packages/contracts, services/graph, services/rag,
# services/experience-engine, services/urban-memory): sono la single source
# of truth per gli schemi (docs/DATA_CONTRACTS.md), per la CandidateSource
# del grafo, per l'onboarding conversazionale e per la composizione dei
# `reason`, per l'AI Experience Engine che decide le tappe, e (Wave 2) per i
# vincoli non negoziabili della Urban Memory (consenso, licenza, pseudonimo,
# curatela — `lucca-urban-memory`). NON vanno aggiunti qui come dipendenze
# pip (non sono pubblicati su un indice). Vanno installati a parte, in
# editable mode, insieme a questo pacchetto:
#
#   pip install -e packages/contracts -e services/graph -e services/rag \
#               -e services/experience-engine -e services/urban-memory \
#               -e services/api
#
# Il codice di `api` importa da `contracts`, `graph`, `rag`,
# `experience_engine` ed `urban_memory` assumendo che siano già installati
# nell'ambiente attivo.

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.hatch.metadata]
allow-direct-references = true
