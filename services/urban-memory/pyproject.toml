[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lucca-urban-memory"
version = "0.1.0"
description = "Lucca Soul Lab — Engine: Urban Memory. Il fossato difendibile del progetto: contenuto che nessun concorrente può acquisire dall'esterno, perché nasce solo dalla partecipazione (racconti, mestieri, dialetto, fotografie di botteghe). Conferimento leggero e contestuale, consenso obbligatorio, licenza sempre tracciata, curatela prima della pubblicazione, aggancio al Knowledge Graph via `RIGUARDA`."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "psycopg[binary]>=3",
    "neo4j>=6.2,<7",
]

# NOTA — pacchetto contratti (packages/contracts):
# `lucca-contracts` è la single source of truth per gli schemi
# (MemoryContribution, MemoryKind, PersonKind...) e NON va aggiunto qui come
# dipendenza pip (non è pubblicato su un indice). Va installato a parte, in
# editable mode, insieme a questo pacchetto:
#
#   pip install -e packages/contracts -e services/urban-memory
#
# NOTA — persistenza reale:
# `urban_memory.repository.PostgresMemoryRepository` persiste DAVVERO via
# `psycopg[binary]` (driver Postgres 3): il DSN arriva dal costruttore,
# tipicamente letto da DATABASE_URL da chi la istanzia — Neon
# (`sslmode=require`) in cloud, Postgres locale sul PC fisso; MAI
# hardcoded, MAI un `if local/cloud`. Lo schema (`memory_contribution`) è
# versionato e idempotente in `sql/00_memory_schema.sql`, applicato da
# `urban_memory.migrate.migrate(dsn)` (o `python -m urban_memory.migrate`)
# prima del primo uso. Il percorso di default, usato dai test e finché
# DATABASE_URL non è configurato, resta `InMemoryMemoryRepository`.
#
# NOTA — aggancio al grafo:
# `urban_memory.graph_link.riguarda_to_cypher` produce SOLO (query, params)
# in modo puro. `link_to_graph`/`Neo4jMemoryLinker` (driver ufficiale
# `neo4j`) eseguono quella query davvero contro Aura (`neo4j+s://`) o Neo4j
# locale (`bolt://`) — lo schema dell'URI vive solo in `NEO4J_URI` (`.env`).

[tool.hatch.build.targets.wheel]
packages = ["urban_memory"]

[tool.hatch.metadata]
allow-direct-references = true
