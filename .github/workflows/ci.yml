name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -e packages/contracts -e services/graph -e services/rag -e services/experience-engine -e services/urban-memory -e services/marketplace -e services/recommender -e services/api
          pip install pytest ruff httpx

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest

      - name: Test services (graph, experience-engine, urban-memory, marketplace, recommender)
        run: pytest services/graph/tests services/experience-engine/tests services/urban-memory/tests services/marketplace/tests services/recommender/tests
