name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 fissato: ubuntu-latest passa a 26.04 dal 19/10 e i test con
        # REQUIRE_POSTGRES=1 dipendono dai binari Postgres 16 dell'immagine 24.04.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Solo ubuntu: se i binari Postgres mancano (es. nuova immagine runner) i test
      # di persistenza FALLISCONO invece di essere saltati. Su windows restano skip.
      REQUIRE_POSTGRES: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -e packages/contracts -e services/graph -e services/rag -e services/experience-engine -e services/urban-memory -e services/marketplace -e services/recommender -e services/intelligence-index -e services/api
          pip install pytest ruff httpx "mypy==2.3.0"

      - name: Lint (ruff)
        run: ruff check .

      # Gate dichiarato in CLAUDE.md (Convenzioni): ogni pacchetto deve dare Success
      # con la config di radice. Un pacchetto per invocazione, come in locale.
      - name: Type check (mypy)
        shell: bash
        run: |
          for pkg in packages/contracts/contracts services/api/api services/experience-engine/experience_engine services/graph/graph services/intelligence-index/intelligence_index services/marketplace/marketplace services/rag/rag services/recommender/recommender services/urban-memory/urban_memory; do
            echo "::group::mypy $pkg"
            mypy "$pkg"
            echo "::endgroup::"
          done

      - name: Test (pytest)
        run: pytest

      - name: Test services (graph, rag, experience-engine, urban-memory, marketplace, recommender, intelligence-index, api)
        run: pytest services/graph/tests services/rag/tests services/experience-engine/tests services/urban-memory/tests services/marketplace/tests services/recommender/tests services/intelligence-index/tests services/api/tests

  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/lucca_soul_app
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
