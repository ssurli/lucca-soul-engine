[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py313"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# I contratti rispecchiano ESATTAMENTE docs/DATA_CONTRACTS.md, che definisce
# `class PersonKind(str, Enum)`: niente StrEnum finché il doc non cambia.
"packages/contracts/contracts/models.py" = ["UP042"]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
