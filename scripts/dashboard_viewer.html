<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Lucca Soul Lab — Dashboard (visualizzatore statico)</title>
<!--
  Visualizzatore STATICO della dashboard Urban Intelligence Index, senza
  build e senza dipendenze esterne (nessun CDN, nessun framework): un solo
  file HTML, apribile con un doppio clic da `file://` mentre il BFF gira in
  locale (`uvicorn api.main:app --reload`, vedi services/api/README.md).

  Non è un sostituto di `apps/lucca_soul_app` (Flutter): è un modo di
  VEDERE lo stesso risultato — GET /dashboard/index e GET /dashboard/flows,
  stesso BFF, stesso contratto (docs/DATA_CONTRACTS.md §7) — senza dover
  compilare Flutter. Stesse scelte di visualizzazione della schermata
  Flutter (lib/screens/dashboard_screen.dart):
    - distribuzione_flussi sempre in evidenza (card grande, mai in un angolo);
    - gli altri indicatori in griglia (Comune: tutti; Hotel/Museo: solo
      attivazione_locale, oltre alla card in evidenza);
    - una cella/indicatore soppresso da k=10 è SEMPRE un badge esplicito
      ("dato insufficiente per garantire l'anonimato"), MAI uno zero, MAI
      omesso dalla lista;
    - soddisfazione assente (nessuna fonte dati reale oggi, mai stimata) è
      un testo DIVERSO ("non ancora misurabile"): un buco dati diverso dalla
      soppressione k=10, non va confuso con essa;
    - se il periodo intero è `disponibile=false`, si mostra lo stato
      esplicito con `motivo_indisponibilita`, MAI un cruscotto con valori a
      zero/finti.

  Richiede che il BFF esponga CORS in lettura per una pagina `file://`
  (origin "null" per il browser) — vedi `dashboard_readonly_cors` in
  `services/api/api/main.py`: un middleware scritto a mano, scoped SOLO a
  `GET`/`OPTIONS` su `/dashboard/*` (non l'intera app, non gli endpoint di
  scrittura). Senza quel middleware questa pagina non funziona (il browser
  blocca la lettura della risposta, non solo l'invio). Vedi `docs/LIMITI.md`
  per la nota di postura di sicurezza: `allow_origins="*"` va bene per uno
  strumento locale, MAI per un deploy pubblico del BFF as-is.
-->
<style>
  :root {
    --primary: #7A5C3E;
    --primary-light: #efe6da;
    --bg: #faf8f5;
    --text: #2c2420;
    --outline: #7a7267;
    --error-bg: #fdecea;
    --error-text: #7a1f1a;
    --badge-bg: #f0e6c8;
    --badge-text: #6b5a1e;
    --card-border: #e3dccf;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 960px;
    margin-left: auto;
    margin-right: auto;
  }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: var(--outline); font-size: 0.9rem; margin-bottom: 20px; }
  .panel {
    background: white;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 20px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  label { font-size: 0.85rem; color: var(--outline); display: block; margin-bottom: 2px; }
  input, select {
    font-size: 0.95rem;
    padding: 6px 8px;
    border: 1px solid var(--card-border);
    border-radius: 6px;
    background: white;
    color: var(--text);
  }
  button {
    font-size: 0.9rem;
    padding: 7px 14px;
    border: 1px solid var(--primary);
    border-radius: 6px;
    background: var(--primary);
    color: white;
    cursor: pointer;
  }
  button.secondary {
    background: white;
    color: var(--primary);
  }
  button.toggle {
    background: white;
    color: var(--primary);
  }
  button.toggle.active {
    background: var(--primary);
    color: white;
  }
  .section-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin: 24px 0 10px;
  }
  .hero {
    background: var(--primary-light);
    border: 1px solid var(--primary);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }
  .hero .value {
    font-size: 2.2rem;
    font-weight: 700;
    color: var(--primary);
    margin-left: auto;
    white-space: nowrap;
  }
  .hero .label { font-weight: 700; }
  .hero .desc { font-size: 0.85rem; color: var(--outline); margin-top: 4px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px;
  }
  .indicator {
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 12px;
  }
  .indicator .label { font-size: 0.8rem; color: var(--outline); }
  .indicator .value { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
  .indicator .value.muted {
    font-size: 0.85rem;
    font-weight: 400;
    color: var(--outline);
  }
  .badge {
    display: inline-block;
    background: var(--badge-bg);
    color: var(--badge-text);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .state-box {
    border-radius: 8px;
    padding: 14px 16px;
    font-size: 0.9rem;
  }
  .state-loading { color: var(--outline); }
  .state-error { background: var(--error-bg); color: var(--error-text); }
  .state-unavailable { background: var(--badge-bg); color: var(--badge-text); }
  .flow-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    margin-bottom: 6px;
  }
  .flow-row .place { font-family: monospace; font-size: 0.9rem; }
  .flow-row .count { font-weight: 700; }
  small.hint { color: var(--outline); }
  .retry-btn { margin-top: 8px; }
</style>
</head>
<body>

<h1>Lucca Soul Lab — Dashboard</h1>
<div class="subtitle">
  Visualizzatore statico (nessun build, nessuna dipendenza) di
  <code>GET /dashboard/index</code> e <code>GET /dashboard/flows</code>.
  Non sostituisce <code>apps/lucca_soul_app</code>: mostra lo stesso risultato.
</div>

<div class="panel">
  <div class="row">
    <div>
      <label for="bffUrl">URL del BFF</label>
      <input id="bffUrl" type="text" size="28" value="http://127.0.0.1:8000">
    </div>
    <div>
      <label for="periodo">Periodo (YYYY-MM)</label>
      <input id="periodo" type="text" size="8" pattern="\d{4}-\d{2}">
    </div>
    <div>
      <label for="giorno">Giorno (opzionale, YYYY-MM-DD)</label>
      <input id="giorno" type="text" size="10" placeholder="tutto il periodo">
    </div>
    <div>
      <label for="ora">Ora (opzionale, 0-23)</label>
      <input id="ora" type="number" min="0" max="23" size="4" placeholder="tutte">
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="reloadBtn">Ricarica</button>
    </div>
  </div>
  <div class="row" style="margin-top:12px;">
    <div>
      <label>Vista</label>
      <button class="toggle active" data-audience="comune">Comune</button>
      <button class="toggle" data-audience="hotel">Hotel</button>
      <button class="toggle" data-audience="museo">Museo</button>
    </div>
  </div>
  <div style="margin-top:10px;">
    <small class="hint" id="audienceHint"></small>
  </div>
</div>

<div class="section-title">Indicatori dell'Urban Intelligence Index</div>
<div id="indexContainer"></div>

<div class="section-title">Distribuzione dei flussi per luogo</div>
<div id="flowsContainer"></div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// Stato e costanti — stesse scelte testuali di lib/util/app_strings.dart
// (Flutter), così questa pagina mostra ESATTAMENTE gli stessi messaggi.
// ---------------------------------------------------------------------------
const CELL_UNAVAILABLE_BADGE = "dato insufficiente per garantire l'anonimato";
const SATISFACTION_UNAVAILABLE = "non ancora misurabile";
const INDEX_UNAVAILABLE_TITLE = "Dato insufficiente per questo periodo";
const INDEX_UNAVAILABLE_FALLBACK =
  "Non c'è ancora abbastanza attività aggregata in questo periodo per " +
  "pubblicare l'index garantendo l'anonimato dei visitatori.";

let audience = "comune"; // "comune" | "hotel" | "museo"

function todayPeriodo() {
  const d = new Date();
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  return `${d.getFullYear()}-${mm}`;
}

function el(tag, className, text) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (text !== undefined) e.textContent = text;
  return e;
}

function pct(v) {
  return `${Math.round(v * 100)}%`;
}

// ---------------------------------------------------------------------------
// Fetch verso il BFF — stesso principio di lib/api/bff_client.dart: un solo
// punto di rete, corpo dell'errore letto da `detail` se presente, MAI un
// dettaglio fabbricato lato client.
// ---------------------------------------------------------------------------
async function fetchJson(path, params) {
  const base = document.getElementById("bffUrl").value.replace(/\/+$/, "");
  const url = new URL(base + path);
  for (const [k, v] of Object.entries(params)) {
    if (v !== null && v !== undefined && v !== "") url.searchParams.set(k, v);
  }
  let response;
  try {
    response = await fetch(url.toString(), { method: "GET" });
  } catch (err) {
    throw new Error(`Impossibile contattare il BFF su ${url}: ${err.message}`);
  }
  let body = null;
  try {
    body = await response.json();
  } catch (_) {
    // corpo non JSON: niente da leggere, si usa il messaggio di default sotto
  }
  if (!response.ok) {
    const detail = body && body.detail ? body.detail : "Il BFF ha risposto con un errore";
    throw new Error(`${detail} (HTTP ${response.status})`);
  }
  return body;
}

// ---------------------------------------------------------------------------
// Stato di caricamento/errore condiviso — stessi TRE stati espliciti
// dell'app Flutter: caricamento, errore di rete/BFF, dato (disponibile o
// esplicitamente soppresso). Mai confusi tra loro.
// ---------------------------------------------------------------------------
function renderLoading(container, label) {
  container.innerHTML = "";
  container.appendChild(el("div", "state-box state-loading", label));
}

function renderError(container, message, onRetry) {
  container.innerHTML = "";
  const box = el("div", "state-box state-error");
  box.appendChild(el("div", null, "Non riesco a contattare il BFF."));
  box.appendChild(el("div", null, message));
  const btn = el("button", "secondary retry-btn", "Riprova");
  btn.onclick = onRetry;
  box.appendChild(btn);
  container.appendChild(box);
}

// ---------------------------------------------------------------------------
// Index (GET /dashboard/index)
// ---------------------------------------------------------------------------
function indicatorCard(icon, label, value, mutedText) {
  const card = el("div", "indicator");
  card.appendChild(el("div", "label", `${icon} ${label}`));
  if (mutedText !== undefined) {
    card.appendChild(el("div", "value muted", mutedText));
  } else {
    card.appendChild(el("div", "value", value));
  }
  return card;
}

function renderIndex(container, resp) {
  container.innerHTML = "";

  // `disponibile=false`: stato esplicito "dato insufficiente" per l'INTERO
  // periodo — MAI un cruscotto con valori a zero/finti.
  if (!resp.disponibile) {
    const box = el("div", "state-box state-unavailable");
    box.appendChild(el("div", null, "🛡 " + INDEX_UNAVAILABLE_TITLE));
    box.appendChild(el("div", null, resp.motivo_indisponibilita || INDEX_UNAVAILABLE_FALLBACK));
    container.appendChild(box);
    return;
  }

  const idx = resp.index;

  // L'indicatore che ci giudica: sempre in evidenza, in ENTRAMBE le viste.
  const hero = el("div", "hero");
  const heroText = el("div");
  heroText.appendChild(el("div", "label", "📊 Distribuzione dei flussi"));
  heroText.appendChild(el(
    "div", "desc",
    "1 = flussi ben distribuiti in città, 0 = concentrati (overtourism)."
  ));
  hero.appendChild(heroText);
  hero.appendChild(el("div", "value", pct(idx.distribuzione_flussi)));
  container.appendChild(hero);

  if (audience !== "comune") {
    // Hotel/Museo: stesso substrato dati, taglio mirato — solo
    // attivazione_locale oltre alla card in evidenza condivisa sopra.
    const grid = el("div", "grid");
    grid.appendChild(indicatorCard("🏪", "Attivazione locale", pct(idx.attivazione_locale)));
    container.appendChild(grid);
    return;
  }

  const grid = el("div", "grid");
  grid.appendChild(indicatorCard("⏱", "Tempo medio esperienza", `${Math.round(idx.tempo_medio_esperienza_min)} min`));
  grid.appendChild(indicatorCard("❤", "Coinvolgimento", pct(idx.coinvolgimento)));
  // soddisfazione: buco dati DIVERSO dalla soppressione k=10 (nessuna fonte
  // reale oggi, mai stimata) — testo diverso, mai confuso con il badge k=10.
  if (idx.soddisfazione === null || idx.soddisfazione === undefined) {
    grid.appendChild(indicatorCard("⭐", "Soddisfazione", null, SATISFACTION_UNAVAILABLE));
  } else {
    grid.appendChild(indicatorCard("⭐", "Soddisfazione", idx.soddisfazione.toFixed(1)));
  }
  grid.appendChild(indicatorCard("↩", "Tasso di ritorno", pct(idx.tasso_ritorno)));
  grid.appendChild(indicatorCard("🧭", "Nuovi percorsi", pct(idx.nuovi_percorsi)));
  grid.appendChild(indicatorCard("🏪", "Attivazione locale", pct(idx.attivazione_locale)));
  grid.appendChild(indicatorCard("📖", "Contributi Urban Memory", String(idx.contributi_memoria)));
  container.appendChild(grid);
}

async function loadIndex() {
  const container = document.getElementById("indexContainer");
  renderLoading(container, "Sto calcolando l'index…");
  const periodo = document.getElementById("periodo").value;
  try {
    const resp = await fetchJson("/dashboard/index", { periodo });
    renderIndex(container, resp);
  } catch (err) {
    renderError(container, err.message, loadIndex);
  }
}

// ---------------------------------------------------------------------------
// Flows (GET /dashboard/flows)
// ---------------------------------------------------------------------------
function renderFlows(container, resp) {
  container.innerHTML = "";
  if (!resp.celle || resp.celle.length === 0) {
    container.appendChild(el("div", "state-box", "Ancora nessun luogo nel grafo."));
    return;
  }
  for (const cella of resp.celle) {
    const row = el("div", "flow-row");
    row.appendChild(el("div", "place", cella.place_id));
    if (cella.disponibile) {
      row.appendChild(el("div", "count", String(cella.conteggio_tappe)));
    } else {
      // Cella soppressa (< k=10 person_id distinti): badge esplicito, MAI
      // uno "0" indistinguibile da un luogo davvero vuoto, MAI omessa.
      row.appendChild(el("div", "badge", "🛡 " + CELL_UNAVAILABLE_BADGE));
    }
    container.appendChild(row);
  }
}

async function loadFlows() {
  const container = document.getElementById("flowsContainer");
  renderLoading(container, "Sto calcolando la heatmap dei flussi…");
  const periodo = document.getElementById("periodo").value;
  const giorno = document.getElementById("giorno").value;
  const ora = document.getElementById("ora").value;
  try {
    const resp = await fetchJson("/dashboard/flows", { periodo, giorno, ora });
    renderFlows(container, resp);
  } catch (err) {
    renderError(container, err.message, loadFlows);
  }
}

function loadAll() {
  loadIndex();
  loadFlows();
}

// ---------------------------------------------------------------------------
// Wiring
// ---------------------------------------------------------------------------
function updateAudienceHint() {
  const hint = document.getElementById("audienceHint");
  hint.textContent = audience === "comune"
    ? "Comune: la salute culturale complessiva della città — prima la distribuzione dei flussi, poi il cruscotto completo."
    : "Hotel/Museo: stessi dati del Comune, taglio su come questo luogo può contribuire a distribuire i flussi.";
}

document.getElementById("periodo").value = todayPeriodo();
document.getElementById("reloadBtn").onclick = loadAll;
document.querySelectorAll("button.toggle").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("button.toggle").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    audience = btn.dataset.audience;
    updateAudienceHint();
    loadIndex(); // solo l'index cambia taglio per audience; i flussi restano gli stessi
  });
});

updateAudienceHint();
loadAll();
</script>
</body>
</html>
